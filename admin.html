<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>기류 후기 관리</title>
<style>
:root{--tint:#007AFF;--paper:#fff;--ink:#1c1c1e;--ink-2:#6c6c70;--line:#e5e5ea;--bg:#f2f2f7;--ok:#248A3D;--warn:#B26A00;--bad:#D70015}
@media (prefers-color-scheme:dark){:root{--paper:#1c1c1e;--ink:#f2f2f7;--ink-2:#98989f;--line:#38383a;--bg:#000;--ok:#30D158;--warn:#FF9F0A;--bad:#FF453A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;padding:0 16px 60px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:22px;margin:22px 0 4px}
.sub{color:var(--ink-2);font-size:13px;margin:0 0 14px}
.card{background:var(--paper);border-radius:14px;padding:14px;margin-bottom:10px}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;margin-bottom:8px}
textarea{resize:vertical;min-height:90px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--bg);color:var(--ink)}
button.pri{background:var(--tint);color:#fff;font-weight:700}
button.ok{background:rgba(52,199,89,.16);color:var(--ok);font-weight:700}
button.bad{background:rgba(255,59,48,.14);color:var(--bad)}
button:disabled{opacity:.5}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.tabs button{white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--ink-2);font-size:12.5px;margin-bottom:6px}
.txt{white-space:pre-wrap;word-break:break-word;margin:6px 0 8px}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.ph img{width:84px;height:84px;object-fit:cover;border-radius:10px}
.act{display:flex;gap:6px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px;min-height:18px}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>후기 관리</h1>
  <p class="sub" id="sub">기류 · 관리자 전용</p>

  <section id="vLogin" class="card" hidden>
    <input id="lEmail" type="email" placeholder="관리자 이메일" autocomplete="email">
    <input id="lPw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <p class="err" id="lErr" role="alert"></p>
    <button class="pri" id="lGo" type="button">로그인</button>
  </section>

  <section id="vNoCfg" class="card" hidden>config.js에 Supabase url과 anonKey를 먼저 넣어 주세요.</section>
  <section id="vDeny" class="card" hidden>관리자 권한이 없는 계정이에요. <button id="dOut" type="button">로그아웃</button></section>

  <section id="vMain" hidden>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="list"></div>
    <div id="manual" class="card" hidden>
      <b>DM으로 받은 후기 직접 등록</b>
      <p class="sub">손님이 DM·카톡으로 보내준 후기를 옮길 때 써요. 게시 동의를 받은 후기만 등록해 주세요.</p>
      <div class="row2"><input id="mNick" placeholder="손님 이름(가려져서 표시)" maxlength="10"><select id="mRate"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select></div>
      <div class="row2"><select id="mProd"><option value="0">베이직</option><option value="1">스탠다드</option><option value="2">프리미엄</option></select><input id="mOpt" placeholder="옵션 (선택)"></div>
      <textarea id="mTxt" maxlength="1000" placeholder="후기 내용"></textarea>
      <label class="sub" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mAgree" style="width:auto;margin:0"> 손님에게 게시 동의를 받았어요</label>
      <p class="err" id="mErr" role="alert"></p>
      <button class="pri" id="mGo" type="button">등록하고 바로 게시</button>
    </div>
    <p style="text-align:center"><button id="out" type="button">로그아웃</button> <a href="index.html" style="margin-left:10px;color:var(--tint)">사이트로</a></p>
  </section>
</div>

<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const CFG=window.GIRYU_CFG||{};
const PN=['베이직','스탠다드','프리미엄'];
const TABS=[['pending','확인 대기'],['approved','게시됨'],['hidden','비공개'],['add','직접 등록']];
let SB=null,ME=null,TAB='pending',ROWS=[];

function show(id){['vLogin','vNoCfg','vDeny','vMain'].forEach(x=>$('#'+x).hidden=x!==id)}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

function boot(){
  if(!CFG.url||!CFG.anonKey){show('vNoCfg');return}
  const go=()=>{SB=window.supabase.createClient(CFG.url,CFG.anonKey);start()};
  if(window.supabase){go();return}
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=go;
  s.onerror=()=>{$('#sub').textContent='로그인 모듈을 불러오지 못했어요. 새로고침해 주세요.'};
  document.head.appendChild(s);
}
async function start(){
  const {data}=await SB.auth.getSession();await check(data&&data.session);
  SB.auth.onAuthStateChange((e,sess)=>{setTimeout(()=>check(sess),0)});
}
async function check(sess){
  ME=sess&&sess.user||null;
  if(!ME){show('vLogin');return}
  const {data}=await SB.from('profiles').select('is_admin,nickname').eq('id',ME.id).maybeSingle();
  if(!data||!data.is_admin){show('vDeny');return}
  show('vMain');renderTabs();await load();
}
$('#lGo').onclick=async()=>{
  $('#lErr').textContent='';
  const {error}=await SB.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lPw').value});
  if(error)$('#lErr').textContent='이메일 또는 비밀번호를 확인해 주세요.';
};
async function logout(){await SB.auth.signOut()}
$('#out').onclick=logout;$('#dOut').onclick=logout;

async function load(){
  const {data,error}=await SB.from('reviews').select('*').order('created_at',{ascending:false});
  if(error){$('#list').replaceChildren(el('div','card','불러오지 못했어요. 잠시 뒤에 다시 시도해 주세요.'));return}
  ROWS=data||[];renderTabs();render();
}
function renderTabs(){
  const t=$('#tabs');t.replaceChildren();
  TABS.forEach(([k,label])=>{
    const n=k==='add'?'':ROWS.filter(r=>r.status===k).length;
    const b=el('button','',label+(n!==''?' '+n:''));
    b.setAttribute('role','tab');b.setAttribute('aria-selected',String(TAB===k));
    b.onclick=()=>{TAB=k;renderTabs();render()};t.appendChild(b);
  });
}
function render(){
  $('#manual').hidden=TAB!=='add';
  const box=$('#list');box.replaceChildren();
  if(TAB==='add')return;
  const rows=ROWS.filter(r=>r.status===TAB);
  if(!rows.length){box.appendChild(el('div','card','해당하는 후기가 없어요.'));return}
  rows.forEach(r=>box.appendChild(card(r)));
}
function card(r){
  const c=el('div','card');
  const m=el('div','meta');
  [r.nickname,'★'.repeat(r.rating),PN[r.product]+(r.option_text?' · '+r.option_text:''),String(r.created_at||'').slice(0,10)].forEach(x=>m.appendChild(el('span','',x)));
  if(r.order_no)m.appendChild(el('span','tag','접수 '+r.order_no));
  m.appendChild(el('span','tag',r.source==='manual'?'직접 등록':'사이트'));
  if(!r.consent_sns&&r.source!=='manual')m.appendChild(el('span','tag','동의 없음'));
  c.appendChild(m);
  const ta=el('div','txt',r.content);c.appendChild(ta);
  if(r.photos&&r.photos.length){const p=el('div','ph');r.photos.forEach(u=>{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';const i=document.createElement('img');i.src=u;i.alt='후기 사진';i.loading='lazy';a.appendChild(i);p.appendChild(a)});c.appendChild(p)}
  const act=el('div','act');
  if(r.status!=='approved'){const b=el('button','ok','게시');b.onclick=()=>setStatus(r,'approved',b);act.appendChild(b)}
  if(r.status!=='hidden'){const b=el('button','','비공개');b.onclick=()=>setStatus(r,'hidden',b);act.appendChild(b)}
  const e=el('button','','내용 수정');e.onclick=()=>editBox(r,c,ta,act);act.appendChild(e);
  const d=el('button','bad','삭제');d.onclick=()=>del(r,d);act.appendChild(d);
  c.appendChild(act);return c;
}
async function setStatus(r,st,btn){
  btn.disabled=true;
  const {error}=await SB.from('reviews').update({status:st}).eq('id',r.id);
  if(error){btn.disabled=false;alert('변경하지 못했어요.');return}
  r.status=st;renderTabs();render();
}
function editBox(r,c,ta,act){
  const t=document.createElement('textarea');t.value=r.content;t.maxLength=1000;
  c.replaceChild(t,ta);act.replaceChildren();
  const s=el('button','pri','저장');
  s.onclick=async()=>{
    const v=t.value.trim();if([...v].length<5){alert('5자 이상 적어주세요.');return}
    const {error}=await SB.from('reviews').update({content:v}).eq('id',r.id);
    if(error){alert('저장하지 못했어요.');return}r.content=v;render();
  };
  const x=el('button','','취소');x.onclick=render;act.append(s,x);
}
function pathOf(u){const k='/review-photos/';const i=u.indexOf(k);return i<0?null:decodeURIComponent(u.slice(i+k.length).split('?')[0])}
async function del(r,btn){
  if(!confirm('이 후기를 삭제할까요? 되돌릴 수 없어요.'))return;
  btn.disabled=true;
  const paths=(r.photos||[]).map(pathOf).filter(Boolean);
  if(paths.length)await SB.storage.from('review-photos').remove(paths);
  const {error}=await SB.from('reviews').delete().eq('id',r.id);
  if(error){btn.disabled=false;alert('삭제하지 못했어요.');return}
  ROWS=ROWS.filter(x=>x.id!==r.id);renderTabs();render();
}
$('#mGo').onclick=async()=>{
  const err=$('#mErr');err.textContent='';
  const nick=$('#mNick').value.trim(),txt=$('#mTxt').value.trim();
  if(!nick){err.textContent='손님 이름을 적어주세요.';return}
  if([...txt].length<5){err.textContent='후기를 5자 이상 적어주세요.';return}
  if(!$('#mAgree').checked){err.textContent='게시 동의 확인이 필요해요.';return}
  $('#mGo').disabled=true;
  const {error}=await SB.from('reviews').insert({user_id:null,nickname:nick,rating:+$('#mRate').value,product:+$('#mProd').value,option_text:$('#mOpt').value.trim(),content:txt,photos:[],consent_sns:true,status:'approved',source:'manual'});
  $('#mGo').disabled=false;
  if(error){err.textContent='등록하지 못했어요.';return}
  ['mNick','mOpt','mTxt'].forEach(i=>$('#'+i).value='');$('#mAgree').checked=false;
  TAB='approved';await load();
};
boot();
</script>
</body>
</html>
